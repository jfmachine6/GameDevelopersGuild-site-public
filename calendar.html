<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101114">
    <meta name="description" content="Published Game Developers Guild events and calendar.">
    <title>Calendar &amp; Events | Game Developers Guild</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/images/favicon.png">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/events.css">
    <script type="module" src="./assets/js/navbar.js"></script>
    <script type="module" src="./assets/js/events-page.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <site-navbar></site-navbar>
    <main id="main" class="events-page">
      <header class="events-heading">
        <div><p class="eyebrow">Game Developers Guild</p><h1>Calendar &amp; Events</h1></div>
        <div class="view-switch" role="group" aria-label="Calendar view">
          <button type="button" data-view="calendar" aria-pressed="false" aria-controls="semester-calendar">Calendar</button>
          <button type="button" data-view="agenda" aria-pressed="true" aria-controls="semester-agenda">Agenda</button>
        </div>
      </header>
      <div id="feed-status" class="events-note" aria-live="polite"><p role="status">Loading published events…</p></div>
      <div id="semester-calendar" hidden></div>
      <div id="semester-agenda"></div>
      <noscript><p>Enable JavaScript to load published events and calendar views.</p></noscript>
    </main>
    <footer class="footer"><span>Game Developers Guild</span><span>Student Organization at Northern Kentucky University</span></footer>
  </body>
</html>
